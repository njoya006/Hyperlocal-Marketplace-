name: hyperlocal_market
description: Connects nearby customers with local shops for ultra-fast delivery.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.2.0
  firebase_messaging: ^15.0.4
  firebase_storage: ^12.1.0

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Maps
  mapbox_maps_flutter: ^2.3.0

  # Location / GPS
  geolocator: ^12.0.0
  geocoding: ^3.0.0

  # Navigation
  go_router: ^14.2.7

  # HTTP & Utils
  dio: ^5.7.0
  equatable: ^2.0.5
  uuid: ^4.4.2
  intl: ^0.19.0

  # Local Storage
  shared_preferences: ^2.3.2

  # UI
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  connectivity_plus: ^6.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/