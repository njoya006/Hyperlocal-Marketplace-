name: hyperlocal_market
description: Connects nearby customers with local shops for ultra-fast delivery.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  cloud_firestore: ^6.2.0
  firebase_messaging: ^16.1.3
  firebase_storage: ^13.2.0

  # State Management
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # Maps
  mapbox_maps_flutter: ^2.3.0

  # Location / GPS
  geolocator: ^14.0.2
  geocoding: ^4.0.0

  # Navigation
  go_router: ^17.2.0

  # HTTP & Utils
  dio: ^5.7.0
  equatable: ^2.0.5
  uuid: ^4.4.2
  intl: ^0.20.2

  # Local Storage
  shared_preferences: ^2.3.2

  # UI
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  connectivity_plus: ^7.1.0
  image_picker: ^1.2.0
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/videos/