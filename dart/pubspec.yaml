name: grade_calculator
description: A Grade Calculator application with console and browser-based GUI modes for university assignment management.
version: 1.0.0
publish_to: none

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  # CSV file parsing
  csv: ^6.0.0

  # Excel (.xlsx) reading and writing
  excel: ^4.0.4

  # Local HTTP server for browser-based GUI mode
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  shelf_static: ^1.1.2

  # Command-line argument parsing (startup menu / mode selection)
  args: ^2.5.0

  # File and path utilities
  path: ^1.9.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
